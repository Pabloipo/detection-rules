title: Desactivación de Windows Defender
id: a7ece38e-0c3d-461e-94c8-d172e905a619
status: experimental
description: >
  Antes de ejecutar su malware, los atacantes intentan cegar al antivirus:
  desactivan la protección en tiempo real (Set-MpPreference
  -DisableRealtimeMonitoring), paran el servicio WinDefend, o se añaden una
  carpeta como exclusión (Add-MpPreference -ExclusionPath) para que no se
  escanee su payload. La regla cubre esas tres variantes.
author: Pablo Iglesias Pose
date: 2026/10/29
references:
  - https://attack.mitre.org/techniques/T1562/001/
logsource:
  product: windows
  category: process_creation
detection:
  selection_setmp:
    CommandLine|contains|all:
      - 'Set-MpPreference'
      - 'disable'
  selection_scstop:
    CommandLine|contains|all:
      - 'windefend'
      - 'stop'
  selection_exclusion:
    CommandLine|contains|all:
      - 'Add-MpPreference'
      - 'ExclusionPath'
  condition: 1 of selection_*
falsepositives:
  - Software de seguridad de terceros que desactive Defender durante su instalación.
level: high
tags:
  - attack.defense_evasion
  - attack.t1562.001
