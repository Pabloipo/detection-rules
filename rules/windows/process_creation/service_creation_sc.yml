title: Creación de servicio con sc.exe apuntando a un binario
id: 3ffdd67c-548b-4a60-9c5e-7637c03a265a
status: experimental
description: >
  Registrar un servicio de Windows es una técnica clásica de persistencia y de
  ejecución como SYSTEM: el servicio arranca solo al iniciar el equipo y corre
  con privilegios altos. Los atacantes usan "sc.exe create ... binPath= <exe>"
  para dejar su binario como servicio. La regla marca sc.exe cuando lleva a la
  vez 'create' y 'binpath', que es justo el registro de un nuevo servicio.
author: Pablo Iglesias Pose
date: 2026/10/29
references:
  - https://attack.mitre.org/techniques/T1543/003/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\sc.exe'
    CommandLine|contains|all:
      - 'create'
      - 'binpath'
  condition: selection
falsepositives:
  - Instaladores de software que registran sus propios servicios.
level: medium
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1543.003
