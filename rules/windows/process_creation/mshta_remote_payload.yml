title: mshta ejecutando payload remoto o script inline
id: e3de13b5-96e6-475d-8fde-75a22272b807
status: experimental
description: >
  mshta.exe ejecuta aplicaciones HTML (.hta) y puede ejecutar código directo
  (VBScript/JScript). Es un binario firmado por Microsoft del que se abusa para
  descargar y ejecutar un .hta desde una URL, o para correr script inline con
  "javascript:" / "vbscript:", saltándose whitelisting. La regla marca mshta
  cuando la línea apunta a una URL o a un protocolo de script (no cuando abre un
  .hta local, que es su uso normal).
author: Pablo Iglesias Pose
date: 2026/10/29
references:
  - https://attack.mitre.org/techniques/T1218/005/
  - https://lolbas-project.github.io/lolbas/Binaries/Mshta/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\mshta.exe'
    CommandLine|contains:
      - 'http'
      - 'javascript:'
      - 'vbscript:'
  condition: selection
falsepositives:
  - Aplicaciones internas que carguen un .hta desde una URL de confianza.
level: high
tags:
  - attack.defense_evasion
  - attack.t1218.005
