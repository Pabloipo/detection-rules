title: Aplicación de Office lanzando una shell o intérprete
id: 41d0f9f7-bae8-4c29-8d9b-ab2c353b6783
status: experimental
description: >
  Una app de Office (Word, Excel, PowerPoint, Outlook…) que crea como hijo un
  cmd, PowerShell, wscript/cscript, mshta, rundll32 o regsvr32 es el patrón
  clásico de una macro maliciosa o un documento con exploit: el usuario abre el
  adjunto de un phishing, la macro se ejecuta y lanza el siguiente eslabón de la
  cadena. Office no suele engendrar intérpretes de comandos en uso normal, así
  que esta relación padre-hijo es una señal fuerte. La regla marca esos
  procesos padre de Office con esos procesos hijo.
author: Pablo Iglesias Pose
date: 2026/10/30
references:
  - https://attack.mitre.org/techniques/T1566/001/
  - https://attack.mitre.org/techniques/T1059/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
      - '\mspub.exe'
      - '\visio.exe'
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
  condition: selection
falsepositives:
  - Plantillas o complementos corporativos que lancen scripts de forma legítima.
level: high
tags:
  - attack.initial_access
  - attack.execution
  - attack.t1566.001
  - attack.t1059
