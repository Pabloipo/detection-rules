title: Borrado de instantáneas de volumen (anti-recuperación)
id: 2e18eabe-8a60-4af3-9806-f9d272df6932
status: experimental
description: >
  Antes de cifrar, casi todo el ransomware borra las Volume Shadow Copies para
  que la víctima no pueda restaurar sus ficheros desde ellas. Se hace con
  "vssadmin delete shadows", "wmic shadowcopy delete" o "wbadmin delete catalog".
  Un sistema sano casi nunca borra sus shadow copies, así que esto es una señal
  de impacto muy fiable. La regla cubre las tres variantes.
author: Pablo Iglesias Pose
date: 2026/10/29
references:
  - https://attack.mitre.org/techniques/T1490/
logsource:
  product: windows
  category: process_creation
detection:
  selection_vss:
    CommandLine|contains|all:
      - 'vssadmin'
      - 'delete'
      - 'shadows'
  selection_wmic:
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  selection_wbadmin:
    CommandLine|contains|all:
      - 'wbadmin'
      - 'delete'
      - 'catalog'
  condition: 1 of selection_*
falsepositives:
  - Tareas de mantenimiento de backups muy puntuales.
level: critical
tags:
  - attack.impact
  - attack.t1490
